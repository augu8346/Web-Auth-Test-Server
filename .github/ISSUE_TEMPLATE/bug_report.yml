name: Bug report
description: Report a reproducible server or website problem using dummy data.
body:
  - type: markdown
    attributes:
      value: Do not include real credentials, private keys, cookies or identifying logs. Follow SECURITY.md for sensitive reports.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, Node/Docker and browser/client versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use localhost and the documented dummy fixtures.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Sanitized diagnostics and validation
      description: Include status codes and relevant test results, not raw credential-bearing logs.
